name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src_csharp/**/*.csproj

      - name: Verify Linux process-group adapter
        if: runner.os == 'Linux'
        run: setsid --version

      - name: Restore
        run: dotnet restore src_csharp/ArbSh.sln

      - name: Audit packages
        run: dotnet list src_csharp/ArbSh.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build src_csharp/ArbSh.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src_csharp/ArbSh.Test/ArbSh.Test.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  eco-integration:
    name: ${{ matrix.os }} / تشغيل with Baa and Takween
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out ArbSh
        uses: actions/checkout@v4
        with:
          path: ArbSh

      - name: Check out Baa
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Baa
          ref: e418bc1d153a8bb431371942ce18f2f029b9ec7f
          path: Baa

      - name: Check out Nazm
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm

      - name: Check out Takween
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Takween
          ref: 6ee36fe20330918c82fa3291110dbd1b7b244e61
          path: Takween

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ArbSh/global.json

      - name: Add Windows MinGW toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          $generator = if ($IsWindows) { @('-G', 'MinGW Makefiles') } else { @() }
          cmake -S Baa -B Baa/build-eco @generator -DCMAKE_BUILD_TYPE=Release
          cmake --build Baa/build-eco --parallel 2
          cmake -S Nazm -B Nazm/build-eco @generator -DCMAKE_BUILD_TYPE=Release
          cmake --build Nazm/build-eco --parallel 2

      - name: Build Takween
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          ./Takween/scripts/build_takween.ps1 `
            -BaaPath (Join-Path $env:GITHUB_WORKSPACE ("Baa/build-eco/baa" + $suffix)) `
            -BaaStdlibPath (Join-Path $env:GITHUB_WORKSPACE 'Baa/stdlib')

      - name: Run تشغيل against the real toolchain
        shell: pwsh
        run: |
          $sep = [IO.Path]::PathSeparator
          $env:PATH = "$env:GITHUB_WORKSPACE/Baa/build-eco$sep$env:GITHUB_WORKSPACE/Nazm/build-eco$sep$env:GITHUB_WORKSPACE/Takween/dist/bin$sep$env:PATH"
          $env:BAA_STDLIB = "$env:GITHUB_WORKSPACE/Baa/stdlib"
          $env:ARBSH_ECO_INTEGRATION = '1'
          dotnet test ArbSh/src_csharp/ArbSh.Test/ArbSh.Test.csproj --configuration Release `
            --filter "FullyQualifiedName~EcoRunTests" --logger "console;verbosity=normal"
