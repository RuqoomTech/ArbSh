name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src_csharp/**/*.csproj

      - name: Verify Linux process-group adapter
        if: runner.os == 'Linux'
        run: setsid --version

      - name: Restore
        run: dotnet restore src_csharp/ArbSh.sln

      - name: Audit packages
        run: dotnet list src_csharp/ArbSh.sln package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build src_csharp/ArbSh.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src_csharp/ArbSh.Test/ArbSh.Test.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  eco-integration:
    name: ${{ matrix.os }} / تشغيل with Baa and Takween
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out ArbSh
        uses: actions/checkout@v4
        with:
          path: ArbSh

      - name: Check out Baa
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Baa
          ref: e418bc1d153a8bb431371942ce18f2f029b9ec7f
          path: Baa

      - name: Check out Nazm
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Nazm
          ref: f58faf061278a610720881bde015f6e70bcbd0c7
          path: Nazm

      - name: Check out Takween
        uses: actions/checkout@v5
        with:
          repository: OmarAglan/Takween
          ref: 6ee36fe20330918c82fa3291110dbd1b7b244e61
          path: Takween

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: ArbSh/global.json

      - name: Add Windows MinGW toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Baa and Nazm
        shell: pwsh
        run: |
          $generator = if ($IsWindows) { @('-G', 'MinGW Makefiles') } else { @() }
          cmake -S Baa -B Baa/build-eco @generator -DCMAKE_BUILD_TYPE=Release
          cmake --build Baa/build-eco --parallel 2
          cmake -S Nazm -B Nazm/build-eco @generator -DCMAKE_BUILD_TYPE=Release
          cmake --build Nazm/build-eco --parallel 2
          # Baa assembles through Nazm's «نظم» launcher found on PATH.
          "$env:GITHUB_WORKSPACE/Baa/build-eco" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:GITHUB_WORKSPACE/Nazm/build-eco" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Takween
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          ./Takween/scripts/build_takween.ps1 `
            -BaaPath (Join-Path $env:GITHUB_WORKSPACE ("Baa/build-eco/baa" + $suffix)) `
            -BaaStdlibPath (Join-Path $env:GITHUB_WORKSPACE 'Baa/stdlib')

      - name: Run تشغيل against the real toolchain
        shell: pwsh
        run: |
          $sep = [IO.Path]::PathSeparator
          $env:PATH = "$env:GITHUB_WORKSPACE/Takween/dist/bin$sep$env:PATH"
          $env:BAA_STDLIB = "$env:GITHUB_WORKSPACE/Baa/stdlib"
          $env:ARBSH_ECO_INTEGRATION = '1'
          dotnet test ArbSh/src_csharp/ArbSh.Test/ArbSh.Test.csproj --configuration Release `
            --filter "FullyQualifiedName~EcoRunTests|FullyQualifiedName~TerminalInteractiveRunTests" --logger "console;verbosity=normal"

  windows-installer:
    name: windows-latest / standalone installer lifecycle
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # The upgrade check needs an older installer; build one from the same source.
      - name: Build previous-version installer
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Version 0.8.0

      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1

      - name: Verify install, upgrade, repair, and uninstall
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          ./scripts/test_installer.ps1 `
            -Installer "dist/installer/arbsh-setup-$version-x64.exe" `
            -PreviousInstaller "dist/installer/arbsh-setup-0.8.0-x64.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: arbsh-windows-installer
          if-no-files-found: error
          path: |
            dist/installer/arbsh-setup-*-x64.exe
            dist/installer/arbsh-setup-*-x64.exe.sha256
            !dist/installer/arbsh-setup-0.8.0-x64.exe*

  linux-packages:
    name: ubuntu-latest / .deb and .tar.gz lifecycle
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install package test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Build previous-version packages
        run: |
          scripts/build_linux_packages.sh 0.8.0
          mkdir -p dist/previous
          mv dist/packages/arbsh_0.8.0-1_amd64.deb* dist/previous/
          rm dist/packages/arbsh-0.8.0-linux-x64.tar.gz*

      - name: Build packages
        run: scripts/build_linux_packages.sh

      - name: Verify install, upgrade, repair, purge, and tarball
        run: |
          scripts/test_linux_packages.sh dist/packages/arbsh_*_amd64.deb \
            dist/previous/arbsh_0.8.0-1_amd64.deb dist/packages/arbsh-*-linux-x64.tar.gz

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: arbsh-linux-packages
          if-no-files-found: error
          path: dist/packages/
